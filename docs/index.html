<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NordicEmergency</title>
<meta name="description" content="NordicEmergency — VR-based emergency response and CPR training.">
<link rel="icon" type="image/png" href="assets/icons/badge.png">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
(function () {
  try {
    var stored = localStorage.getItem("ne_theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top">
      <img class="brand-mark" src="assets/icons/badge.png" alt="">
      <span class="brand-name" data-i18n="hero.title">NordicEmergency</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="#solutions" data-i18n="nav.solutions">Solutions</a></li>
        <li><a href="#academy" data-i18n="nav.academy">Academy</a></li>
        <li><a href="#labs" data-i18n="nav.labs">Labs</a></li>
        <li><a href="#team" data-i18n="nav.team">Team</a></li>
        <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
      </ul>
    </nav>

    <div class="lang-switcher" id="lang-switcher" aria-label="Language"></div>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="container">
      <h1 data-i18n="hero.title">NordicEmergency</h1>
      <p class="tagline" data-i18n="hero.tagline">VR-based emergency response and CPR training.</p>
      <p class="hero-lead" data-i18n="hero.lead"></p>
    </div>
  </section>

  <section id="solutions" class="section">
    <div class="container">
      <h2 data-i18n="nav.solutions">Solutions</h2>
      <div class="section-rule"></div>
      <p class="section-intro" data-i18n="solutions.intro"></p>
      <div class="cards" id="solutions-list"></div>
    </div>
  </section>

  <section id="academy" class="section section-alt">
    <div class="container">
      <h2 data-i18n="nav.academy">Academy</h2>
      <div class="section-rule"></div>
      <p data-i18n="academy.description"></p>
    </div>
  </section>

  <section id="labs" class="section">
    <div class="container">
      <h2 data-i18n="nav.labs">Labs</h2>
      <div class="section-rule"></div>
      <p data-i18n="labs.description"></p>
    </div>
  </section>

  <section id="team" class="section section-alt">
    <div class="container">
      <h2 data-i18n="nav.team">Team</h2>
      <div class="section-rule"></div>
      <div class="tabs" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="core" data-i18n="team.tabs.core">Core Team</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="board" data-i18n="team.tabs.board">Board</button>
      </div>
      <div class="people" id="team-core" role="tabpanel"></div>
      <div class="people" id="team-board" role="tabpanel" hidden></div>
    </div>
  </section>

  <section id="press" class="section" hidden>
    <div class="container">
      <h2 data-i18n="press.heading">In the Media</h2>
      <div class="section-rule"></div>
      <div class="article-list" id="article-list"></div>
    </div>
  </section>

  <section id="customers" class="section section-alt" hidden>
    <div class="container">
      <h2 data-i18n="customers.heading">Customers</h2>
      <div class="section-rule"></div>
      <div class="customer-list" id="customer-list"></div>
    </div>
  </section>

  <section id="contact" class="section">
    <div class="container">
      <h2 data-i18n="nav.contact">Contact</h2>
      <div class="section-rule"></div>
      <p data-i18n="contact.description"></p>

      <form id="contact-form" class="contact-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="cf-name" data-i18n="contact.form.name_label">Name</label>
            <input id="cf-name" name="name" type="text" required>
          </div>
          <div class="field">
            <label for="cf-email" data-i18n="contact.form.email_label">Email</label>
            <input id="cf-email" name="email" type="email" required>
          </div>
        </div>
        <div class="field">
          <label for="cf-subject" data-i18n="contact.form.subject_label">Subject</label>
          <select id="cf-subject" name="subject"></select>
        </div>
        <div class="field">
          <label for="cf-message" data-i18n="contact.form.message_label">Message</label>
          <textarea id="cf-message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-primary" data-i18n="contact.form.submit">Send message</button>
      </form>

      <p class="contact-email">
        <span data-i18n="contact.email_label">Email</span>:
        <a id="contact-email" href="#"></a>
      </p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p>&copy; <span id="year"></span> <span id="footer-company">Nordic Emergency ApS</span></p>
      <p class="footer-meta" id="footer-meta"></p>
    </div>
    <div class="footer-links">
      <a id="footer-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a id="footer-discord" href="#" target="_blank" rel="noopener">Discord</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
