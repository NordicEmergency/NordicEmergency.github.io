<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NordicEmergency</title>
<meta name="description" content="NordicEmergency — VR-based emergency response and CPR training.">
<link rel="icon" type="image/png" href="assets/icons/badge.png">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
(function () {
  try {
    var stored = localStorage.getItem("ne_theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top">
      <img class="brand-mark" src="assets/icons/badge.png" alt="">
      <span class="brand-name" data-i18n="hero.title">NordicEmergency</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="#solutions" data-i18n="nav.solutions">Solutions</a></li>
        <li><a href="#academy" data-i18n="nav.academy">Academy</a></li>
        <li><a href="#labs" data-i18n="nav.labs">Labs</a></li>
        <li><a href="#team" data-i18n="nav.team">Team</a></li>
        <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
      </ul>
    </nav>

    <div class="lang-switcher" id="lang-switcher" aria-label="Language"></div>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="container">
      <h1 data-i18n="hero.title">NordicEmergency</h1>
      <p class="tagline" data-i18n="hero.tagline">VR-based emergency response and CPR training.</p>
      <p class="hero-lead" data-i18n="hero.lead"></p>
    </div>
  </section>

  <section id="solutions" class="section">
    <div class="container">
      <h2 data-i18n="nav.solutions">Solutions</h2>
      <div class="section-rule"></div>
      <p class="section-intro" data-i18n="solutions.intro"></p>
      <div class="cards" id="solutions-list"></div>
    </div>
  </section>

  <section id="gallery" class="section">
    <div class="container">
      <div class="gallery-grid">
        <div class="gallery-item"><img src="assets/images/promo_001.jpg" alt=""></div>
        <div class="gallery-item"><img src="assets/images/promo_002.jpg" alt=""></div>
        <div class="gallery-item"><img src="assets/images/promo_003.jpg" alt=""></div>
      </div>
    </div>
  </section>

  <section id="academy" class="section section-alt">
    <div class="container">
      <h2 data-i18n="nav.academy">Academy</h2>
      <div class="section-rule"></div>
      <p data-i18n="academy.description"></p>
    </div>
  </section>

  <section id="labs" class="section">
    <div class="container">
      <h2 data-i18n="nav.labs">Labs</h2>
      <div class="section-rule"></div>
      <p data-i18n="labs.description"></p>
    </div>
  </section>

  <section id="team" class="section section-alt">
    <div class="container">
      <h2 data-i18n="nav.team">Team</h2>
      <div class="section-rule"></div>
      <div class="tabs" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="core" data-i18n="team.tabs.core">Core Team</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="board" data-i18n="team.tabs.board">Board</button>
      </div>
      <div class="people" id="team-core" role="tabpanel"></div>
      <div class="people" id="team-board" role="tabpanel" hidden></div>
    </div>
  </section>

  <section id="press" class="section" hidden>
    <div class="container">
      <h2 data-i18n="press.heading">In the Media</h2>
      <div class="section-rule"></div>
      <div class="article-list" id="article-list"></div>
    </div>
  </section>

  <section id="customers" class="section section-alt" hidden>
    <div class="container">
      <h2 data-i18n="customers.heading">Customers</h2>
      <div class="section-rule"></div>
      <div class="customer-list" id="customer-list"></div>
    </div>
  </section>

  <section id="contact" class="section">
    <div class="container">
      <h2 data-i18n="nav.contact">Contact</h2>
      <div class="section-rule"></div>
      <p data-i18n="contact.description"></p>

      <form id="contact-form" class="contact-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="cf-name" data-i18n="contact.form.name_label">Name</label>
            <input id="cf-name" name="name" type="text" required>
          </div>
          <div class="field">
            <label for="cf-email" data-i18n="contact.form.email_label">Email</label>
            <input id="cf-email" name="email" type="email" required>
          </div>
        </div>
        <div class="field">
          <label for="cf-subject" data-i18n="contact.form.subject_label">Subject</label>
          <select id="cf-subject" name="subject"></select>
        </div>
        <div class="field">
          <label for="cf-message" data-i18n="contact.form.message_label">Message</label>
          <textarea id="cf-message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-primary" data-i18n="contact.form.submit">Send message</button>
      </form>

      <p class="contact-email">
        <span data-i18n="contact.email_label">Email</span>:
        <a id="contact-email" href="#"></a>
      </p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p>&copy; <span id="year"></span> <span id="footer-company">Nordic Emergency ApS</span></p>
      <p class="footer-meta" id="footer-meta"></p>
    </div>
    <div class="footer-links">
      <a id="footer-linkedin" class="footer-icon-link" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a id="footer-discord" class="footer-icon-link" href="#" target="_blank" rel="noopener" aria-label="Discord">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
      </a>
      <a href="privacy/" data-i18n="footer.privacy">Privacy Policy</a>
    </div>
  </div>
</footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
