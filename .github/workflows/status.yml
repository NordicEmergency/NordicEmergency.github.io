name: Status

# Checks the services every 5 minutes for nordicemergency.dk/status/ and keeps the result,
# status.json, as the only commit on the status-data branch (force-pushed, so it never grows).
# GitHub may start a scheduled run late or skip one; the page says when the data is stale.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            docs/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Previous status
        run: |
          if git fetch --depth=1 origin status-data; then
            git show FETCH_HEAD:status.json > "$RUNNER_TEMP/previous.json"
          else
            echo "No status-data branch yet, starting fresh"
          fi
      - name: Check services
        run: |
          prev="$RUNNER_TEMP/previous.json"
          [ -f "$prev" ] || prev=-
          node tools/status-check.mjs "$prev" "$RUNNER_TEMP/out/status.json"
      - name: Publish to status-data
        working-directory: ${{ runner.temp }}/out
        run: |
          git init -q -b status-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json
          git commit -q -m "Status $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data
